plugins {
	id "net.fabricmc.fabric-loom" version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE")
	from("LICENSE-Odin")
}

// Copies the output of /srp export into the mod's resources, so the next build ships it as the
// default model and map set. Pass -Pfrom=<folder> to use a different export folder.
tasks.register("importTraining", Copy) {
	def from = project.hasProperty("from") ? project.property("from") :
		"${System.getenv('APPDATA')}/.minecraft/config/roompredictor/export"
	from(from) {
		include "model.json", "maps.jsonl"
	}
	into "src/main/resources/assets/roompredictor/default"
	doFirst {
		if (!file("${from}/model.json").exists()) throw new GradleException("No export found in ${from}; run /srp export in game first.")
	}
}
